openapi: 3.2.0
info:
  title: Swagger ForkIt API
  description: API reference for ForkIt-server API
  license:
    name: MIT
    url: https://github.com/ASauvage/ForkIt-server/blob/main/LICENSE
  version: "1.0"
servers:
  - url: http://localhost:3000/api
    description: Localhost server (3000)
tags:
  - name: ingredient
    summary: Ingredient management operations
    description: Ingredient management operations
  - name: library
    summary: Library management operations
    description: Library management operations
  - name: recipe
    summary: Recipe management operations
    description: Recipe management operations
  - name: tag
    summary: Tag management operations
    description: Tag management operations
paths:
  /ingredients:
    get:
      tags:
        - ingredient
      summary: Find ingredients.
      description: Find ingredients using filters.
      operationId: getIngredients
      parameters:
        - name: search
          in: query
          description: Filter results by name.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Limit results.
          required: false
          schema:
            type: number
            default: 100
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - metadata
                  - ingredients
                properties:
                  metadata:
                    $ref: '#/components/schemas/Metadata'
                  ingredients:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ingredient'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - ingredient
      summary: Create ingredient.
      description: Create ingredient.
      operationId: postIngredient
      requestBody:
        description: Create a new ingredient
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientInput'
        required: true
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - metadata
                  - ingredient
                properties:
                  metadata:
                    $ref: '#/components/schemas/Metadata'
                  ingredient:
                    $ref: '#/components/schemas/Ingredient'
        '403':
          description: Invalid ingredient payload
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ingredient/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - ingredient
      summary: Find ingredient by ID.
      description: Find ingredient by ID.
      operationId: getIngredient
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - metadata
                  - ingredient
                properties:
                  metadata:
                    $ref: '#/components/schemas/Metadata'
                  ingredient:
                    $ref: '#/components/schemas/Ingredient'
        '404':
          description: No tag found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags:
        - ingredient
      summary: Update ingredient by ID.
      description: Update ingredient by ID.
      operationId: putIngredient
      requestBody:
        description: Update an ingredient
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientInput'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - metadata
                  - ingredient
                properties:
                  metadata:
                    $ref: '#/components/schemas/Metadata'
                  ingredient:
                    $ref: '#/components/schemas/Ingredient'
        '403':
          description: Invalid ingredient payload
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - ingredient
      summary: Delete ingredient by ID.
      description: Delete ingredient by ID.
      operationId: deleteIngredient
      responses:
        '204':
          description: Deleted (No Content)
        '404':
          description: No ingredient found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
