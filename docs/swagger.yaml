components:
  schemas:
    Error:
      type: object
      required:
        - metadata
        - error
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        error:
          type: object
          required:
            - message
          properties:
            message:
              type: string
            details:
              type: string
            stack:
              type: string
    Metadata:
      type: object
      required:
        - request_id
        - user_id
        - current_time
        - version
        - request
        - execution_time_ms
      properties:
        request_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        current_time:
          type: object
          required:
            - value
            - timestamp
          properties:
            value:
              type: string
              format: date-time
            timestamp:
              type: integer
        version:
          type: string
        request:
          type: object
          required:
            - method
            - path
          properties:
            method:
              type: string
            path:
              type: string
        execution_time_ms:
          type: number
          format: float
    Ingredient:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    IngredientInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    Library:
      type: object
      required:
        - id
        - name
        - owner_id
        - recipes
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
          format: uuid
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/Recipe'
    LibraryInput:
      type: object
      required:
        - name
        - author_id
      properties:
        name:
          type: string
        author_id:
          type: uuid
    Recipe:
      type: object
      required:
        - id
        - name
        - owner_id
        - library_id
        - created_at
        - updated_at
        - tags
        - ingredients
        - steps
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
          format: uuid
        library_id:
          type: string
          format: uuid
        description:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri-reference
          nullable: true
        prep_time_min:
          type: integer
          nullable: true
        cook_time_min:
          type: integer
          nullable: true
        servings:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredient'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RecipeStep'
    RecipeIngredient:
      type: object
      required:
        - ingredient
        - quantity
      properties:
        ingredient:
          $ref: '#/components/schemas/Ingredient'
        quantity:
          type: number
          format: float
        unit:
          type: string
          nullable: true
          enum: [g, ml, tbsp, tsp, cup, pcs, pinch, oz, lbs]
        notes:
          type: string
          nullable: true
    RecipeStep:
      type: object
      required:
        - index
        - text
      properties:
        index:
          type: integer
        text:
          type: string
    RecipeInput:
      type: object
      required:
        - name
        - library_id
        - owner_id
        - ingredients
      properties:
        name:
          type: string
        library_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        description:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri
          nullable: true
        prep_time_min:
          type: integer
          nullable: true
        cook_time_min:
          type: integer
          nullable: true
        servings:
          type: integer
          nullable: true
        tags:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        ingredients:
          type: array
          items:
            type: object
            required:
              - ingredient
              - quantity
            properties:
              ingredient:
                type: string
                format: uuid
              quantity:
                type: number
              unit:
                type: string
                nullable: true
                enum: [g, ml, tbsp, tsp, cup, pcs, pinch, oz, lbs]
              notes:
                type: string
                nullable: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RecipeStep'
    Tag:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          nullable: true
    TagInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        color:
          type: string
          nullable: true
